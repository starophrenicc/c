<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>civx</title>

  <link rel="preload" href="space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="favicon.ico">

  <meta name="description" content="civx — heya!">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://civx.lol/">
  <meta property="og:title" content="civx">
  <meta property="og:description" content="heya!">
  <meta property="og:image" content="https://civx.lol/stickerbomb.png">
  <meta property="og:image:width" content="2500">
  <meta property="og:image:height" content="1438">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f59409">
  <style>
    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("space-grotesk-latin-500-normal.woff2") format("woff2"),
        url("space-grotesk-latin-500-normal.woff") format("woff");
    }

    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("space-grotesk-latin-700-normal.woff2") format("woff2"),
        url("space-grotesk-latin-700-normal.woff") format("woff");
    }

    :root {
      --star-x: 95%;
      --star-y: 0.47em;
      --star-size: 0.09em;

      --star-green-x: 95%;
      --star-green-y: 0.47em;
      --star-green-size: 0.09em;

      --wordmark-align: -0.155em;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      height: 100dvh;
      overscroll-behavior: none;
    }

    body {
      background: #f59409;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    #bg,
    #meadow,
    #buddy,
    .wordmark .star,
    .socials img {
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      transition: opacity 0.8s ease;
    }

    #meadow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
      opacity: 0;
    }

    .grain,
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .grain {
      background-image: url("grain.png");
      background-repeat: repeat;
      background-size: 128px 128px;
      opacity: 0.16;
      mix-blend-mode: overlay;
    }

    .vignette {
      background: radial-gradient(ellipse at center,
          rgba(0, 0, 0, 0) 45%,
          rgba(0, 0, 0, 0.1) 72%,
          rgba(0, 0, 0, 0.26) 100%);
    }

    #viz {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 32vh;
      max-height: 260px;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.1s ease 0.25s;
    }

    body.entered #viz {
      opacity: 1;
    }

    .enter {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: rgba(4, 8, 22, 0.55);
      backdrop-filter: blur(3px);
      cursor: pointer;
      transition: opacity 0.55s ease, backdrop-filter 0.55s ease;
    }

    .enter p {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.55);
      user-select: none;
      animation: breathe 2.6s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }

    .enter.gone {
      opacity: 0;
      backdrop-filter: blur(0);
      pointer-events: none;
    }

    #buddy {
      position: fixed;
      bottom: 28%;
      width: 90px;
      height: auto;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      border-radius: 8px;
    }

    body.meadow #buddy {
      opacity: 1;
    }

    #bomb {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background: transparent;
      transition: opacity 0.5s ease, background 0.45s ease;
    }

    #bomb.filling {
      background: #f59409;
    }

    #bomb.clear {
      opacity: 0;
    }

    .center {
      display: grid;
      justify-items: center;
      transform: translateY(-5vh);
      transition: all 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    body.meadow {
      background: #316010;
    }

    body.meadow .wordmark {
      margin-left: var(--wordmark-align);
    }

    body.meadow .wordmark .star {
      left: var(--star-green-x);
      top: var(--star-green-y);
      width: var(--star-green-size);
    }

    body.meadow .center {
      position: fixed;
      left: 6vw;
      top: 50%;
      justify-items: start;
      transform: translateY(-50%);
    }

    .wordmark {
      position: relative;
      margin: 0;
      font-size: clamp(2.1rem, 9.8vw, 8.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.45);
      user-select: none;
      opacity: 0;
    }

    .tagline {
      margin: 0.1em 0 0;
      font-size: clamp(0.95rem, 2.2vw, 1.4rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.45);
      user-select: none;
      opacity: 0;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-top: 0.55em;
      opacity: 0;
    }

    .socials a {
      display: block;
      line-height: 0;
    }

    .socials img {
      height: 19px;
      width: auto;
      display: block;
      opacity: 0.82;
      filter: drop-shadow(0 1px 10px rgba(0, 0, 0, 0.35));
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .socials a:hover img {
      opacity: 1;
      transform: scale(1.12);
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.75));
    }

    body.entered .socials {
      animation: emerge 1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.7s forwards;
    }

    body.entered .tagline {
      animation: emerge 1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.55s forwards;
    }

    .wordmark .glyph {
      position: relative;
      display: inline-block;
      letter-spacing: normal;
      margin-right: -0.03em;
    }

    .wordmark .star {
      position: absolute;
      left: var(--star-x);
      top: var(--star-y);
      width: var(--star-size);
      height: auto;
      pointer-events: auto;
      cursor: pointer;
      transform: translate(-50%, -50%);
      padding: 0.12em;
      margin: -0.12em;
      box-sizing: content-box;
    }

    body.entered .wordmark .star {
      animation: spin 14s linear infinite;
    }



    @keyframes spin {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    body.entered .wordmark {
      animation: emerge 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s forwards;
    }

    @keyframes emerge {
      from {
        opacity: 0;
        filter: blur(24px);
        letter-spacing: 0.12em;
      }

      to {
        opacity: 1;
        filter: blur(0);
        letter-spacing: -0.03em;
      }
    }

    .ticker {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 8px;
      z-index: 11;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.6s ease 0.25s;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent);
      mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent);
    }

    body.entered .ticker {
      opacity: 1;
    }

    .ticker-top {
      position: absolute;
      top: calc(50% + 24px);
      left: 50%;
      transform: translateX(-50%);
      width: var(--prompt-w, 150px);
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent);
      mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent);
    }

    .ticker .row,
    .ticker-top .row {
      display: flex;
      width: max-content;
      margin: 0;
      white-space: nowrap;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
      user-select: none;
      animation: drift 18s linear infinite;
      will-change: transform;
    }

    .ticker-top .row {
      animation-duration: 15s;
    }

    .ticker span,
    .ticker-top span {
      padding-right: 1.5em;
    }

    @keyframes drift {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .volume {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(6px);
      color: #fff;
    }

    .volume[data-level="0"] .wave1,
    .volume[data-level="0"] .wave2,
    .volume[data-level="1"] .wave2 {
      display: none;
    }

    .volume:not([data-level="0"]) .mute {
      display: none;
    }

    .volume svg {
      width: 15px;
      height: 15px;
      display: block;
      opacity: 0.85;
      flex: none;
    }

    .volume input {
      -webkit-appearance: none;
      appearance: none;
      width: 92px;
      height: 3px;
      margin: 0;
      padding: 11px 0;
      box-sizing: content-box;
      background-clip: content-box;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.32);
      cursor: pointer;
    }

    .volume input:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 6px;
    }

    .volume input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
    }

    .volume input::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 640px) {
      .wordmark {
        font-size: clamp(2.6rem, 20vw, 6rem);
      }

      #viz {
        height: 24vh;
      }

      .volume {
        top: 14px;
        right: 14px;
        padding: 7px 11px;
        gap: 8px;
      }

      .volume input {
        width: 62px;
      }

      .ticker .row,
      .ticker-top .row {
        font-size: 0.8rem;
      }

      .center {
        transform: translateY(-8vh);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #bg {
        display: none;
      }

      .grain {
        display: none;
      }

      #viz {
        display: none;
      }

      body {
        background: #f59409 url("poster.jpg") center / cover no-repeat;
      }

      .enter p {
        animation: none;
        opacity: 0.9;
      }

      .ticker .row,
      .ticker-top .row {
        animation: none;
      }

      body.entered .wordmark .star {
        animation: none;
      }

      body.entered .wordmark {
        animation: none;
        opacity: 1;
      }

      body.entered .socials {
        animation: none;
        opacity: 1;
      }

      body.entered .tagline {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <video id="bg" autoplay muted loop playsinline poster="poster.jpg">
    <source src="bg.mp4" type="video/mp4">
  </video>
  <img id="meadow" src="meadow.jpg" alt="" aria-hidden="true">
  <img id="buddy" src="buddy.jpg" alt="" aria-hidden="true">

  <canvas id="viz" aria-hidden="true"></canvas>

  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <canvas id="bomb" aria-hidden="true"></canvas>

  <div class="center">
    <h1 class="wordmark" id="wordmark">c<span class="glyph">i<img class="star" src="star.png" alt="" aria-hidden="true"
          draggable="false"></span>vx</h1>
    <p class="tagline">what's up? </p>
    <div class="socials">
      <a href="https://github.com/starophrenicc" target="_blank" rel="noopener noreferrer">
        <img src="github.png" alt="GitHub">
      </a>
      <a href="https://discord.com/users/924745421321039934" target="_blank" rel="noopener noreferrer">
        <img src="discord.png" alt="Discord">
      </a>
    </div>
  </div>

  <div class="ticker">
    <div class="row">
      <span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span>
      <span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span>
    </div>
  </div>

  <div class="volume" id="volumeUi" data-level="1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path class="wave1" d="M15 9.5a4 4 0 0 1 0 5"></path>
      <path class="wave2" d="M18 7a8 8 0 0 1 0 10"></path>
      <line class="mute" x1="16" y1="9.5" x2="21" y2="14.5"></line>
      <line class="mute" x1="21" y1="9.5" x2="16" y2="14.5"></line>
    </svg>
    <input type="range" id="volume" min="0" max="100" value="50" aria-label="Volume">
  </div>

  <audio id="jaydes" preload="none" loop></audio>
  <audio id="whoosh" src="whoosh.mp3" preload="auto"></audio>
  <audio id="meadowtrack" src="firstdate.mp3" preload="none" loop></audio>

  <div class="enter" id="enter" role="button" tabindex="0" aria-label="Enter">
    <p>click anywhere</p>
    <div class="ticker-top">
      <div class="row"></div>
    </div>
  </div>

  <script>
    const track = document.getElementById("jaydes");
    const volume = document.getElementById("volume");
    const enter = document.getElementById("enter");
    const canvas = document.getElementById("viz");
    const whoosh = document.getElementById("whoosh");

    const TRACKS = [
      "mintbeat.mp3",
    ];

    track.src = TRACKS[Math.floor(Math.random() * TRACKS.length)];

    const volumeUi = document.getElementById("volumeUi");
    let gainNode = null;
    let audioCtx = null;
    let meadowSrc = null;
    const meadowTrack = document.getElementById("meadowtrack");

    function syncVolume() {
      const v = volume.value / 100;
      track.volume = v;
      meadowTrack.volume = v;
      if (gainNode) gainNode.gain.value = v;
      whoosh.volume = Math.min(1, v * 2.8);
      volumeUi.dataset.level = v === 0 ? "0" : v < 0.5 ? "1" : "2";
    }

    syncVolume();

    let entered = false;

    function debounce(fn, ms) {
      let t;
      return () => {
        clearTimeout(t);
        t = setTimeout(fn, ms);
      };
    }

    const ctx = canvas.getContext("2d");
    const VIZ_ORANGE = ["#ffffff", "#fff2dc", "#ffc078"];
    const VIZ_GREEN = ["#ffffff", "#e2ffd4", "#5cc93a"];
    let VIZ_COLORS = VIZ_ORANGE;
    let analyser, bins, gradient, W, H;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      gradient = ctx.createLinearGradient(0, H * 0.1, 0, H);
      gradient.addColorStop(0, VIZ_COLORS[0]);
      gradient.addColorStop(0.5, VIZ_COLORS[1]);
      gradient.addColorStop(1, VIZ_COLORS[2]);
    }

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(bins);

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = gradient;

      const count = Math.max(48, Math.floor(W / 15));
      const slot = W / count;
      const barW = slot * 0.55;
      const base = H + 2;
      const maxH = H - 8;

      for (let i = 0; i < count; i++) {
        const bin = Math.floor(Math.pow(i / count, 2) * bins.length * 0.7);
        const h = Math.max(barW, (bins[bin] / 255) * maxH);
        const x = i * slot + (slot - barW) / 2;

        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(x, base - h, barW, h, [barW / 2, barW / 2, 0, 0]);
        } else {
          ctx.rect(x, base - h, barW, h);
        }
        ctx.fill();
      }
    }

    function startSpectrum() {
      try {
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx = audio;
        const source = audio.createMediaElementSource(track);
        gainNode = audio.createGain();
        gainNode.gain.value = volume.value / 100;
        analyser = audio.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.82;
        source.connect(gainNode);
        gainNode.connect(analyser);
        analyser.connect(audio.destination);
        audio.resume();

        bins = new Uint8Array(analyser.frequencyBinCount);
        resize();
        window.addEventListener("resize", debounce(resize, 150));
        requestAnimationFrame(draw);
      } catch (e) {
        canvas.style.display = "none";
      }
    }

    const bomb = document.getElementById("bomb");
    const bctx = bomb.getContext("2d");

    if (document.fonts && document.fonts.load) {
      document.fonts.load('700 32px "Space Grotesk"');
    }

    const STICKERS = [".civx", "JamL"];
    const CX = 104;
    const CY = 46;
    const PER_FRAME = 16;

    function buildStickers(W, H) {
      const cols = Math.ceil(W / CX) + 2;
      const rows = Math.ceil(H / CY) + 2;
      const list = [];

      for (let y = -1; y < rows; y++) {
        for (let x = -1; x < cols; x++) {
          list.push({
            x: x * CX + (y % 2 ? CX / 2 : 0) + (Math.random() - 0.5) * CX * 0.3,
            y: y * CY + (Math.random() - 0.5) * CY * 0.3,
            r: (Math.random() * 50 - 25) * Math.PI / 180,
            alt: Math.random() < 0.5,
            text: STICKERS[Math.floor(Math.random() * STICKERS.length)],
            size: 26 + Math.random() * 16
          });
        }
      }

      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    let BOMB_ACCENT = "#f59409";

    function drawSticker(ctx, st) {
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(st.r);
      ctx.font = "700 " + st.size + "px 'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif";
      const tw = ctx.measureText(st.text).width;
      const pw = Math.max(tw + st.size * 0.9, CX * 1.25);
      const ph = Math.max(st.size * 1.5, CY * 1.45);
      ctx.fillStyle = st.alt ? BOMB_ACCENT : "#ffffff";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-pw / 2, -ph / 2, pw, ph, st.size * 0.3);
      else ctx.rect(-pw / 2, -ph / 2, pw, ph);
      ctx.fill();
      ctx.fillStyle = st.alt ? "#ffffff" : BOMB_ACCENT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(st.text, 0, 1);
      ctx.restore();
    }

    function runBomb(done) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const W = window.innerWidth;
      const H = window.innerHeight;

      bomb.width = W * dpr;
      bomb.height = H * dpr;
      bomb.style.width = W + "px";
      bomb.style.height = H + "px";
      bctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      requestAnimationFrame(() => bomb.classList.add("filling"));

      const list = buildStickers(W, H);
      let i = 0;

      (function step() {
        for (let k = 0; k < PER_FRAME && i < list.length; k++, i++) drawSticker(bctx, list[i]);
        if (i < list.length) requestAnimationFrame(step);
        else done();
      })();
    }

    function enterSite() {
      if (entered) return;
      entered = true;
      track.load();
      startSpectrum();
      enter.classList.add("gone");

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.body.classList.add("entered");
        enter.remove();
        bomb.remove();
        track.play().catch(() => { });
        return;
      }

      whoosh.play().catch(() => { });

      runBomb(() => {
        document.body.classList.add("entered");
        enter.remove();
        setTimeout(() => {
          bomb.classList.add("clear");
          track.play().catch(() => { });
        }, 260);
        setTimeout(() => bomb.remove(), 900);
      });
    }

    document.addEventListener("contextmenu", e => {
      if (e.target.closest("a")) return;
      e.preventDefault();
    });

    enter.addEventListener("click", enterSite);
    document.addEventListener("keydown", enterSite);

    const starEl = document.querySelector(".wordmark .star");
    const meadowEl = document.getElementById("meadow");
    const buddyEl = document.getElementById("buddy");
    let meadowMode = false;
    let buddyAnim = null;

    let buddyX = null;

    function walkBuddy() {
      if (buddyAnim) clearTimeout(buddyAnim);
      const minX = window.innerWidth * 0.35;
      const maxX = window.innerWidth * 0.62;
      const targetX = minX + Math.random() * (maxX - minX);
      const nowX = buddyEl.getBoundingClientRect().left;

      if (Math.abs(targetX - nowX) > 6) {
        buddyEl.style.transform = targetX > nowX ? "scaleX(-1)" : "scaleX(1)";
      }
      buddyX = targetX;

      const dur = 2.5 + Math.random() * 3;
      buddyEl.style.transition = "left " + dur + "s ease-in-out, opacity 0.6s ease";
      buddyEl.style.left = targetX + "px";
      buddyAnim = setTimeout(walkBuddy, dur * 1000 + 600 + Math.random() * 2000);
    }

    function toggleMeadow() {
      meadowMode = !meadowMode;
      if (meadowMode) {
        document.getElementById("bg").style.opacity = "0";
        meadowEl.style.opacity = "1";
        document.body.classList.add("meadow");
        if (starEl) starEl.src = "stargreen.png";
        VIZ_COLORS = VIZ_GREEN;
        if (gradient) resize();

        track.pause();
        if (audioCtx && gainNode && !meadowSrc) {
          try {
            meadowSrc = audioCtx.createMediaElementSource(meadowTrack);
            meadowSrc.connect(gainNode);
          } catch (e) { }
        }
        meadowTrack.play().catch(() => { });
        buddyX = window.innerWidth * 0.5;
        buddyEl.style.left = buddyX + "px";
        buddyEl.style.transform = "scaleX(1)";
        buddyEl.style.transition = "opacity 0.6s ease";
        walkBuddy();
      } else {
        document.getElementById("bg").style.opacity = "1";
        meadowEl.style.opacity = "0";
        document.body.classList.remove("meadow");
        if (starEl) starEl.src = "star.png";
        VIZ_COLORS = VIZ_ORANGE;
        if (gradient) resize();

        meadowTrack.pause();
        track.play().catch(() => { });
        if (buddyAnim) { clearTimeout(buddyAnim); buddyAnim = null; }
      }
    }

    if (starEl) {
      starEl.addEventListener("click", e => {
        e.stopPropagation();
        if (!entered) return;

        whoosh.currentTime = 0;
        whoosh.play().catch(() => { });

        BOMB_ACCENT = meadowMode ? "#f59409" : "#14b51f";

        const nb = document.createElement("canvas");
        nb.setAttribute("aria-hidden", "true");
        nb.style.cssText = "position:fixed;inset:0;z-index:22;pointer-events:none;background:transparent;transition:opacity 0.5s ease,background 0.45s ease";
        document.body.appendChild(nb);
        requestAnimationFrame(() => { nb.style.background = BOMB_ACCENT; });
        const nctx = nb.getContext("2d");
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const W = window.innerWidth, H = window.innerHeight;
        nb.width = W * dpr;
        nb.height = H * dpr;
        nb.style.width = W + "px";
        nb.style.height = H + "px";
        nctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const list = buildStickers(W, H);
        let si = 0;

        (function step() {
          for (let k = 0; k < PER_FRAME && si < list.length; k++, si++) drawSticker(nctx, list[si]);
          if (si < list.length) {
            requestAnimationFrame(step);
          } else {
            toggleMeadow();
            setTimeout(() => { nb.style.opacity = "0"; }, 300);
            setTimeout(() => nb.remove(), 900);
          }
        })();
      });
    }

    volume.addEventListener("input", syncVolume);

    const prompt = document.querySelector(".enter p");

    function syncPromptWidth() {
      if (!prompt) return;
      document.documentElement.style.setProperty(
        "--prompt-w", prompt.getBoundingClientRect().width + "px");
    }

    syncPromptWidth();
    window.addEventListener("resize", debounce(syncPromptWidth, 150));

    const tickerUnit = document.querySelector(".ticker .row").innerHTML;

    function fillTickers() {
      document.querySelectorAll(".ticker .row, .ticker-top .row").forEach(row => {
        row.innerHTML = tickerUnit;
        let guard = 0;
        while (row.scrollWidth < window.innerWidth && guard++ < 40) row.innerHTML += tickerUnit;
        row.innerHTML += row.innerHTML;
      });
    }

    fillTickers();
    window.addEventListener("resize", debounce(fillTickers, 200));

    const TITLE = "civx";
    const MARK = "\u2731";
    const HOLD = 5;

    const frames = [];
    for (let i = 0; i <= TITLE.length; i++) frames.push(TITLE.slice(0, i) + MARK + TITLE.slice(i));
    for (let i = TITLE.length - 1; i > 0; i--) frames.push(TITLE.slice(0, i) + MARK + TITLE.slice(i));
    for (let i = 0; i < HOLD; i++) frames.push(TITLE);

    const STEP_MS = 260;
    const started = Date.now();

    setInterval(() => {
      const i = Math.floor((Date.now() - started) / STEP_MS) % frames.length;
      document.title = frames[i];
    }, STEP_MS);
  </script>

</body>

</html>
