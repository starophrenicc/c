<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>civx</title>

  <link rel="preload" href="space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="favicon.ico">

  <meta name="description" content="civx — heya!">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://civx.lol/">
  <meta property="og:title" content="civx">
  <meta property="og:description" content="heya!">
  <meta property="og:image" content="https://civx.lol/stickerbomb.png">
  <meta property="og:image:width" content="2500">
  <meta property="og:image:height" content="1438">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f59409">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <video id="bg" autoplay muted loop playsinline poster="poster.jpg">
    <source src="bg.mp4" type="video/mp4">
  </video>
  <img id="meadow" src="meadow.jpg" alt="" aria-hidden="true">
  <img id="aero" src="aero.png" alt="" aria-hidden="true">
  <img id="buddy" src="buddy.jpg" alt="" aria-hidden="true">

  <canvas id="viz" aria-hidden="true"></canvas>

  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <canvas id="bomb" aria-hidden="true"></canvas>

  <div class="center">
    <h1 class="wordmark" id="wordmark">c<span class="glyph">i<img class="star" src="star.png" alt="" aria-hidden="true"
          draggable="false"></span>vx</h1>
    <p class="tagline">what's up? </p>
    <div class="socials">
      <a href="https://github.com/starophrenicc" target="_blank" rel="noopener noreferrer">
        <img src="github.png" alt="GitHub">
      </a>
      <a href="https://discord.com/users/924745421321039934" target="_blank" rel="noopener noreferrer">
        <img src="discord.png" alt="Discord">
      </a>
    </div>
    <p class="aero-note">I love frutiger slop!</p>
  </div>

  <div class="ticker">
    <div class="row">
      <span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span>
      <span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span><span>JamL</span><span>.civx</span>
    </div>
  </div>

  <div class="volume" id="volumeUi" data-level="1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path class="wave1" d="M15 9.5a4 4 0 0 1 0 5"></path>
      <path class="wave2" d="M18 7a8 8 0 0 1 0 10"></path>
      <line class="mute" x1="16" y1="9.5" x2="21" y2="14.5"></line>
      <line class="mute" x1="21" y1="9.5" x2="16" y2="14.5"></line>
    </svg>
    <input type="range" id="volume" min="0" max="100" value="50" aria-label="Volume">
  </div>

  <audio id="jaydes" preload="none" loop></audio>
  <audio id="whoosh" src="whoosh.mp3" preload="auto"></audio>
  <audio id="meadowtrack" src="firstdate.mp3" preload="none" loop></audio>
  <audio id="aerotrack" src="aero.mp3" preload="none" loop></audio>

  <div class="enter" id="enter" role="button" tabindex="0" aria-label="Enter">
    <p>click anywhere</p>
    <div class="ticker-top">
      <div class="row"></div>
    </div>
  </div>

  <script src="main.js"></script>

</body>

</html>
