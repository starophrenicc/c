<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>civx</title>

  <link rel="preload" href="space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="favicon.ico">

  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f59409">
  <style>
    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("space-grotesk-latin-500-normal.woff2") format("woff2"),
        url("space-grotesk-latin-500-normal.woff") format("woff");
    }

    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("space-grotesk-latin-700-normal.woff2") format("woff2"),
        url("space-grotesk-latin-700-normal.woff") format("woff");
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      height: 100dvh;
      overscroll-behavior: none;
      background: #f59409;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
      cursor: url("cursor.png") 1 1, auto;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .grain,
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .grain {
      background-image: url("grain.png");
      background-repeat: repeat;
      background-size: 128px 128px;
      opacity: 0.16;
      mix-blend-mode: overlay;
    }

    .vignette {
      background: radial-gradient(ellipse at center,
          rgba(0, 0, 0, 0) 45%,
          rgba(0, 0, 0, 0.1) 72%,
          rgba(0, 0, 0, 0.26) 100%);
    }

    .center {
      display: grid;
      justify-items: center;
      transform: translateY(-4vh);
    }

    .code {
      margin: 0;
      font-size: clamp(3rem, 14vw, 12rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.45);
      user-select: none;
      opacity: 0;
      animation: emerge 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s forwards;
    }

    @keyframes emerge {
      from {
        opacity: 0;
        filter: blur(24px);
        letter-spacing: 0.12em;
      }

      to {
        opacity: 1;
        filter: blur(0);
        letter-spacing: -0.03em;
      }
    }

    .line {
      margin: 0.5em 0 0;
      font-size: clamp(0.95rem, 2.2vw, 1.4rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.45);
      user-select: none;
      opacity: 0;
      animation: emerge 1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.55s forwards;
    }

    .home {
      margin-top: 1.5em;
      padding: 0.55em 1.4em;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: clamp(0.85rem, 1.8vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-decoration: none;
      opacity: 0;
      animation: emerge 1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.8s forwards;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .home:hover {
      background: rgba(0, 0, 0, 0.4);
      transform: scale(1.05);
    }

    body {
      cursor: url("cursor.png") 1 1, auto;
    }

    ::selection {
      background: #f59409;
      color: #000;
    }

    #trail-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    @media (prefers-reduced-motion: reduce) {
      #bg {
        display: none;
      }

      .grain {
        display: none;
      }

      body {
        background: #f59409 url("poster.jpg") center / cover no-repeat;
      }

      .code,
      .line,
      .home {
        animation: none;
        opacity: 1;
      }

    }
  </style>
</head>

<body>

  <video id="bg" autoplay muted loop playsinline poster="poster.jpg">
    <source src="bg.mp4" type="video/mp4">
  </video>

  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <canvas id="trail-canvas" aria-hidden="true"></canvas>

  <div class="center">
    <h1 class="code">404</h1>
    <p class="line">nothing here</p>
    <a class="home" href="/">go back</a>
  </div>

  <script>
    (function () {
      const tc = document.getElementById("trail-canvas");
      const tx = tc.getContext("2d");
      let tw = 0, th = 0;
      const particles = [];

      function resizeTrail() {
        tw = tc.width = window.innerWidth;
        th = tc.height = window.innerHeight;
      }
      resizeTrail();
      window.addEventListener("resize", resizeTrail);

      let mx = -999, my = -999;
      window.addEventListener("mousemove", e => { mx = e.clientX; my = e.clientY; });

      function spawnParticle() {
        if (mx < 0) return;
        particles.push({ x: mx, y: my, vx: (Math.random()-0.5)*1.2, vy: (Math.random()-0.5)*1.2-0.5, r: 3+Math.random()*3, life: 1, decay: 0.045+Math.random()*0.03 });
      }

      let acc = 0;
      (function loop() {
        requestAnimationFrame(loop);
        tx.clearRect(0, 0, tw, th);
        if (++acc % 2 === 0) spawnParticle();
        for (let i = particles.length-1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life -= p.decay;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          tx.beginPath();
          tx.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2);
          tx.fillStyle = "rgba(245,148,9,"+p.life*0.7+")";
          tx.fill();
        }
      })();
    })();
  </script>
</body>

</html>
